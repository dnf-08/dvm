<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>music app</title>
</head>
<body>
<hr>

<h2>Search artists</h2>
    <p>type an artist's name and then click search</p>

    <form method="GET">
        <input type="text" name="artist" value="{{ input }}" placeholder="ex: radiohead">
        <button type="submit">Search</button>
        {% url 'home' as home_url %}
        <button type="button" onclick="window.location.href='{{ home_url }}'" style="float: right;">HOME</button>
    </form>
    <hr>
    {% if artists %}
        <h3>RESULTS:</h3>
        <ul>
            {% for artist in artists %}
                <li>
                    <a href="{{ artist.url }}" target="_blank">{{ artist.name }}</a>
                    || the number of monthly listeners {{ artist.name }} is: {{ artist.listeners }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
<hr>
