{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>music app</title>
    <link rel="stylesheet" href="{% static 'lastfm/css/page.css' %}">
</head>
<body>
<hr>

<h2>Search albums</h2>
    <p>type an album's name and then click search</p>

    <form method="GET">
        <input type="text" name="album" value="{{ input }}" placeholder="ex: nevermind">
        <button type="submit">Search</button>
        {% url 'home' as home_url %}
        <button type="button" onclick="window.location.href='{{ home_url }}'" style="float: right; padding: 2px 30px; background-color: #51a3be; color: blue; font-size: 20px;">home</button>
    <hr>
    {% if albums %}
        <h3>results:</h3>
        <ul>
            {% for album in albums %}
                <li>
                    <a href="{{ album.url }}" target="_blank">{{ album.name }}</a>
                    by {{ album.artist }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
